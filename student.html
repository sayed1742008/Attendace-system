<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الحضور</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main: #0f172a; --card-bg: #1e293b; --accent-blue: #2563eb; --border-color: #334155; --text-primary: #f8fafc; --text-secondary: #94a3b8; }
        body { background: var(--bg-main); color: var(--text-primary); font-family: 'Cairo', sans-serif; }
        .student-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.75rem; width: 100%; max-width: 440px; box-shadow: 0 20px 25px -5px rgba(0,0,0,.4); }
        .search-box { position: relative; }
        .search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
        .input-custom { background: #0f172a; border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 10px; padding: .75rem 2.8rem .75rem 1rem; font-size: 16px; }
        .input-custom:focus { background: #0f172a; border-color: var(--accent-blue); color: var(--text-primary); box-shadow: 0 0 0 3px rgba(37,99,235,.2); }
        .results { display: flex; flex-direction: column; gap: .4rem; margin-top: .75rem; max-height: 260px; overflow-y: auto; }
        .result-btn { text-align: start; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 10px; padding: .7rem 1rem; font-family: inherit; }
        .result-btn.selected { border-color: var(--accent-blue); background: rgba(37,99,235,.2); }
        .btn-submit { background: var(--accent-blue); color: #fff; border: none; border-radius: 10px; padding: .8rem; font-weight: 700; }
        .btn-submit:hover { background: #1d4ed8; color: #fff; }
        .btn-submit:disabled { opacity: .5; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
<div class="student-card">
    <div class="text-center mb-4">
        <div class="bg-primary bg-opacity-10 text-primary d-inline-flex p-3 rounded-circle mb-3"><i class="fa-solid fa-user-check fa-2x"></i></div>
        <h4 class="fw-bold mb-1">تسجيل حضور الطالب</h4>
        <p class="text-secondary small">اكتب اسمك للبحث ثم اخترْه لتأكيد الحضور</p>
    </div>

    <div id="form">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="form-control input-custom" placeholder="اكتب اسمك هنا للبحث..." autocomplete="off">
        </div>
        <div id="results" class="results"></div>
        <button id="submitBtn" class="btn btn-submit w-100 mt-4" disabled><i class="fa-solid fa-check me-1"></i> تأكيد الحضور</button>
    </div>

    <div id="alertBox" class="mt-3 text-center small fw-bold"></div>
</div>

<script>
    const token = new URLSearchParams(location.search).get('c') || '';
    const $ = (id) => document.getElementById(id);
    let selectedName = '';
    let timer = null;

    function say(text, cls) { $('alertBox').className = 'mt-3 text-center small fw-bold ' + cls; $('alertBox').textContent = text; }

    function getDeviceUuid() {
        try {
            let id = localStorage.getItem('attendance_device_uuid');
            if (!id) {
                id = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now());
                localStorage.setItem('attendance_device_uuid', id);
            }
            return id;
        } catch (e) { return ''; }
    }

    function lockForm() {
        $('searchInput').disabled = true;
        $('submitBtn').disabled = true;
        $('results').innerHTML = '';
    }

    function renderResults(names) {
        const box = $('results');
        box.innerHTML = '';
        selectedName = '';
        $('submitBtn').disabled = true;
        if (!names.length) {
            const p = document.createElement('div');
            p.className = 'text-secondary small text-center py-2';
            p.textContent = 'لا توجد أسماء مطابقة';
            box.appendChild(p);
            return;
        }
        for (const name of names) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'result-btn';
            b.textContent = name;
            b.onclick = () => {
                selectedName = name;
                box.querySelectorAll('.result-btn').forEach(x => x.classList.remove('selected'));
                b.classList.add('selected');
                $('submitBtn').disabled = false;
            };
            box.appendChild(b);
        }
    }

    $('searchInput').addEventListener('input', () => {
        clearTimeout(timer);
        const q = $('searchInput').value.trim();
        if (q.length < 2) { $('results').innerHTML = ''; selectedName = ''; $('submitBtn').disabled = true; return; }
        timer = setTimeout(async () => {
            try {
                const res = await fetch('/api/search?q=' + encodeURIComponent(q));
                renderResults(await res.json());
            } catch (e) { say('تعذر الاتصال بالخادم، حاول مرة أخرى', 'text-danger'); }
        }, 250);
    });

    $('submitBtn').addEventListener('click', async () => {
        if (!selectedName) { say('يرجى البحث واختيار اسمك أولاً', 'text-danger'); return; }
        $('submitBtn').disabled = true;
        say('جاري التسجيل...', 'text-secondary');
        try {
            const res = await fetch('/api/mark_attendance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ student_name: selectedName, device_uuid: getDeviceUuid(), token })
            });
            const data = await res.json();
            if (res.ok) { say(data.message, 'text-success'); lockForm(); }
            else { say(data.error, 'text-danger'); $('submitBtn').disabled = false; }
        } catch (e) {
            say('حدث خطأ في الاتصال بالشبكة، حاول مرة أخرى', 'text-danger');
            $('submitBtn').disabled = false;
        }
    });

    if (!token) { say('رابط غير صالح. امسح الـ QR Code الموجود على شاشة المحاضرة.', 'text-danger'); lockForm(); }
</script>
</body>
</html>
