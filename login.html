<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الدكتور</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Cairo', sans-serif; }
        .box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2rem; width: 100%; max-width: 380px; }
        .form-control { background: #0f172a; border-color: #334155; color: #f8fafc; }
        .form-control:focus { background: #0f172a; color: #f8fafc; border-color: #2563eb; box-shadow: none; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <form method="post" class="box">
        <h4 class="fw-bold text-center mb-4">لوحة تحكم الدكتور</h4>
        {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
        <input type="password" name="password" class="form-control mb-3" placeholder="كلمة المرور" required autofocus>
        <button class="btn btn-primary w-100 fw-bold">دخول</button>
    </form>
</body>
</html>
